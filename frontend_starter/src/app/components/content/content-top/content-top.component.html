<header>
  <nav class="navbar navbar-expand-lg bg-primary shadow  p-navbar" data-bs-theme="dark">
    <div class="container-fluid">
      <button class="btn btn-outline-light me-3 opacity-50 rounded" (click)="toggleMenu()">
        <i class="bi " [ngClass]="isMenuOpen ? 'bi-x-lg' : 'bi-grid-3x3-gap-fill'" style="font-size: 25px;"></i>
      </button>
      <a class="navbar-brand" [href]="logoLink">
        <img src="assets/images/logo-epi-dor.png" width="80" class="d-inline-block align-middle" alt="Logo Epi-Dor" />
      </a>
      <a class="navbar-brand text-uppercase">{{ title }}</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarColor01" aria-controls="navbarColor01" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarColor01">
        <ul class="navbar-nav me-auto">
        </ul>
        <ul class="nav nav-pills nav-fill">
          <li class="nav-item dropdown disabled opacity-100">
            <a class="nav-link dropdown-toggle text-dark rounded" id="navbarDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
              <i class="bi bi-bell" style="font-size: 30px; color: white;">
              </i>
            </a>
            <span class="position-absolute top-0 start-10 badge rounded-pill bg-danger d-none" id="there_is_today_event_notification">
            </span>
            <span class="position-absolute top-0 start-10 badge rounded-pill bg-success" id="there_is_not_today_event_notification">
              <i class="bi bi-check"></i>
            </span>
            <ul class="dropdown-menu dropdown-menu-end m-2 d-none" id="today_event_notification">
              <li class="border-bottom">
                <span class="dropdown-item">
                  <!--Ajourd'hui le @DateTime.Today!.ToString("dd/MM/yyyy").
              <p>Vous avez actuellment des formulaires non traités.</p>-->
                </span>
              </li>
              <a class="text-decoration-none" href="#">
              <li class="border-bottom pt-2 pb-2">
                <span class="ms-3 me-1" id="there_is_today_checklis_event_notification">0</span>
                Check-list(s)
              </li>
              </a>
              <a class="text-decoration-none">
              <li class="border-bottom pt-2 pb-2">
                <span class="ms-3 me-1" id="there_is_today_followup_event_notification">0</span>
                Suivi(s)
              </li>
              </a>
              <a class="text-decoration-none">
              <li class="border-bottom pt-2 pb-2">
                <span class="ms-3 me-1" id="there_is_today_handover_event_notification">0</span>
                Passation(s)
              </li>
              </a>
              <a class="text-decoration-none">
              <li class="border-bottom pt-2 pb-2">
                <span class="ms-3 me-1" id="there_is_today_task_event_notification">0</span>
                Tâche(s)
              </li>
              </a>
            </ul>
          </li>

          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle text-dark rounded" href="#" id="navbarDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
              <i class="bi bi-person" style="font-size: 30px; color: white;"></i>
            </a>
            <ul class="dropdown-menu dropdown-menu-end m-2">
              <li class="border-bottom">
                <span class="dropdown-item">{{userName}} !</span>
              </li>
              <li>
                <a class="dropdown-item"><i class="bi bi-person"></i> Mon Profil</a>
              </li>
              <li>
                <a (click)="logout()" style="cursor: pointer" class="dropdown-item"><i class="bi bi-box-arrow-left"></i> Déconnexion</a>
              </li>
            </ul>
          </li>

        </ul>
      </div>
    </div>
  </nav>

  <div class="sidebar" [class.open]="isMenuOpen">
    <ul class="list-group list-group-flush">
      <li *ngFor="let item of menuItems" class="list-group-item bg-transparent text-white border-0">
        <a [routerLink]="item.path"
           routerLinkActive="active"
           [routerLinkActiveOptions]="{ exact: true }"
           class="text-white text-decoration-none d-flex align-items-center gap-2">
          <i class="bi fs-3" [ngClass]="item.icon"></i>
          {{ item.label }}
        </a>
      </li>
    </ul>
  </div>
</header>
